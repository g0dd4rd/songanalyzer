<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1329" />
    </radialGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Disk -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#334155" stroke-width="8" />

  <!-- 12-Tone Chromatic Clock Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="5" />

  <!-- Harmonic Constellation Polygon (Major 7th Chord: 0, 4, 7, 11) -->
  <polygon points="256,71 416,163 348,416 93,348" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-width="6" stroke-linejoin="round" filter="url(#glow)" />

  <!-- 12 Chromatic Node Dots -->
  <!-- 0: C -->
  <circle cx="256" cy="71" r="14" fill="#f59e0b" stroke="#fff" stroke-width="2" />
  <!-- 1: C# -->
  <circle cx="348.5" cy="95.8" r="8" fill="#38bdf8" />
  <!-- 2: D -->
  <circle cx="416.2" cy="163.5" r="8" fill="#38bdf8" />
  <!-- 3: D# -->
  <circle cx="441" cy="256" r="8" fill="#38bdf8" />
  <!-- 4: E -->
  <circle cx="416.2" cy="348.5" r="14" fill="#f59e0b" stroke="#fff" stroke-width="2" />
  <!-- 5: F -->
  <circle cx="348.5" cy="416.2" r="8" fill="#38bdf8" />
  <!-- 6: F# -->
  <circle cx="256" cy="441" r="8" fill="#38bdf8" />
  <!-- 7: G -->
  <circle cx="163.5" cy="416.2" r="14" fill="#f59e0b" stroke="#fff" stroke-width="2" />
  <!-- 8: G# -->
  <circle cx="95.8" cy="348.5" r="8" fill="#38bdf8" />
  <!-- 9: A -->
  <circle cx="71" cy="256" r="8" fill="#38bdf8" />
  <!-- 10: A# -->
  <circle cx="95.8" cy="163.5" r="8" fill="#38bdf8" />
  <!-- 11: B -->
  <circle cx="163.5" cy="95.8" r="14" fill="#f59e0b" stroke="#fff" stroke-width="2" />

  <!-- Stylized Music Beamed Notes Glyph -->
  <g fill="url(#beamGrad)" stroke="url(#beamGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left notehead -->
    <ellipse cx="206" cy="310" rx="30" ry="22" transform="rotate(-20 206 310)" />
    <!-- Right notehead -->
    <ellipse cx="306" cy="285" rx="30" ry="22" transform="rotate(-20 306 285)" />
    <!-- Stems -->
    <line x1="230" y1="300" x2="230" y2="185" stroke-width="13" />
    <line x1="330" y1="275" x2="330" y2="160" stroke-width="13" />
    <!-- Heavy Beam -->
    <polygon points="223,195 337,170 337,145 223,170" fill="url(#beamGrad)" stroke="none" />
  </g>
</svg>
